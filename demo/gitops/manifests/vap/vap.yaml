---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: deny-agent-writes-to-production
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps", ""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["deployments", "pods", "services", "configmaps"]
      - apiGroups: ["serving.kserve.io"]
        apiVersions: ["v1beta1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["inferenceservices"]
  matchConditions:
    - name: only-production-namespace
      expression: "request.namespace == 'production'"
  validations:
    - expression: >-
        !request.userInfo.username.startsWith('system:serviceaccount:')
        || request.userInfo.username.startsWith('system:serviceaccount:argocd:')
        || request.userInfo.username.startsWith('system:serviceaccount:argo:')
        || request.userInfo.username.startsWith('system:serviceaccount:kserve:')
        || request.userInfo.username.startsWith('system:serviceaccount:mlops-pipeline:')
      message: "Production namespace writes are restricted to ArgoCD (system:serviceaccount:argocd:*), Argo Workflows (system:serviceaccount:argo:*), KServe (system:serviceaccount:kserve:*), and the MLOps pipeline (system:serviceaccount:mlops-pipeline:*). Other ServiceAccount principals must open a PR to gitops-prod for human review."
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: deny-agent-writes-to-production-binding
spec:
  policyName: deny-agent-writes-to-production
  validationActions: ["Deny", "Audit"]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: production
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: staging-quota
  namespace: staging
spec:
  hard:
    requests.cpu: "1"
    requests.memory: "1Gi"
    limits.cpu: "2"
    limits.memory: "2Gi"
    count/deployments.apps: "10"
    count/pods: "20"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: production-quota
  namespace: production
spec:
  hard:
    requests.cpu: "2"
    requests.memory: "2Gi"
    limits.cpu: "4"
    limits.memory: "4Gi"
    count/deployments.apps: "20"
    count/pods: "40"
