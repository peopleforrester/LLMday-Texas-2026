---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: claude-agent
  namespace: staging
  annotations:
    llmday.demo/intentionally-overscoped: "true"
    llmday.demo/purpose: "Demo of server-side enforcement catching an over-permissive agent"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: claude-agent-namespace-edit
  namespace: staging
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["serving.kserve.io"]
    resources: ["inferenceservices"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: claude-agent-namespace-edit
  namespace: staging
subjects:
  - kind: ServiceAccount
    name: claude-agent
    namespace: staging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: claude-agent-namespace-edit
---
# Read-only in production so Beat 1's `kubectl get deployments` succeeds
# before the hook denies the write.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: claude-agent-production-read
  namespace: production
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["serving.kserve.io"]
    resources: ["inferenceservices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: claude-agent-production-read
  namespace: production
subjects:
  - kind: ServiceAccount
    name: claude-agent
    namespace: staging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: claude-agent-production-read
