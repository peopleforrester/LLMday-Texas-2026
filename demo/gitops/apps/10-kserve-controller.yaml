apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kserve
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://kserve.github.io/kserve
      chart: kserve-resources
      targetRevision: v0.15.2
      helm:
        releaseName: kserve
        valueFiles:
          - $values/demo/gitops/values/kserve-values.yaml
    - repoURL: https://github.com/peopleforrester/LLMday-Texas-2026
      targetRevision: staging
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kserve
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
