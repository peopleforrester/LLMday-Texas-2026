driver:
  enabled: true
  kind: modern_ebpf

tty: true

falco:
  json_output: true
  json_include_output_property: true
  log_level: info

# Custom Falco rules. Each key becomes a file under /etc/falco/rules.d/
# inside every Falco DaemonSet pod. These are the Beat 4 detectors:
#   - "Agent exec in production" fires whenever a shell binary is
#     spawned inside a production-namespace pod with containerd-shim as
#     its parent — the syscall signature of `kubectl exec POD -- /bin/sh ...`.
#     The default Falco "Terminal shell in container" rule excludes too
#     many programs (shell_binaries, jenkins_plugin_install_binaries,
#     fluentbit_binaries, ...) for our scenario to fire reliably, so we
#     define a tighter, demo-specific rule.
#   - "Read sensitive file in production" fires on /etc/shadow,
#     /etc/sudoers, or anything under /etc/sudoers.d/ being opened in a
#     production pod. Backup trigger; the exec rule above will usually
#     fire first because the shell spawn precedes the file open.
# Falco Talon's rules (in falco-talon-values.yaml) match these rule names
# verbatim and run kubernetes:terminate against the originating pod.
customRules:
  llmday-rules.yaml: |-
    - rule: Agent exec in production
      desc: >
        A shell binary spawned inside a production-namespace pod with
        containerd-shim as its parent — the syscall signature of a
        kubectl exec into the container. Native startup processes
        (nginx, docker-entrypoint, etc.) don't match because their
        proc.name isn't a shell. Replacement pods recreated by the
        ReplicaSet don't fire unless something execs into them.
      condition: >
        spawned_process and container
        and k8s.ns.name = "production"
        and proc.pname = "containerd-shim"
        and proc.name in (sh, bash, ksh, zsh, dash, ash)
      output: >
        Agent exec detected in production pod
        (user=%user.name pod=%k8s.pod.name ns=%k8s.ns.name
         container=%container.name proc=%proc.name parent=%proc.pname
         cmdline=%proc.cmdline)
      priority: CRITICAL
      tags: [llmday, agent, exec, mitre_execution, T1059]

    - rule: Read sensitive file in production
      desc: >
        Any read of /etc/shadow, /etc/sudoers, or anything under
        /etc/sudoers.d/ from a production pod. The default Falco
        "Read sensitive file untrusted" rule excludes shell_binaries
        and many other process names, so the kubectl-exec path slips
        through it; this tighter rule fires on the demo scenario.
      condition: >
        open_read
        and container
        and k8s.ns.name = "production"
        and (fd.name = /etc/shadow or fd.name = /etc/sudoers
             or fd.name startswith /etc/sudoers.d)
      output: >
        Sensitive file read attempt in production
        (file=%fd.name pod=%k8s.pod.name proc=%proc.name cmd=%proc.cmdline)
      priority: CRITICAL
      tags: [llmday, agent, sensitive_file, mitre_credential_access, T1555]

# Falcosidekick routes Falco events to Prometheus, Slack, etc.
falcosidekick:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi
  webui:
    enabled: false
  config:
    prometheus:
      enabled: true
    # Forward events to Falco Talon (response engine). Talon runs as a
    # sibling Helm release 'falco-talon' in the same namespace, listening
    # on its ClusterIP service at port 2803. See 35-falco-talon.yaml.
    talon:
      address: "http://falco-talon:2803"

falcoctl:
  artifact:
    install:
      enabled: true
    follow:
      enabled: true

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

tolerations:
  - operator: Exists
