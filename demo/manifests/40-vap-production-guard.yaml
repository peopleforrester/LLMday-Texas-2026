---
# Layer 3 of the three-layer pipeline guardrails: a Kubernetes
# ValidatingAdmissionPolicy that denies writes to the production
# namespace from ServiceAccount principals, except ArgoCD and the
# MLOps pipeline. GA since Kubernetes 1.30. CEL-evaluated. Runs
# inside the API server: no webhook, no controller, no custom code.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: deny-agent-writes-to-production
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:   ["apps"]
        apiVersions: ["v1"]
        operations:  ["CREATE", "UPDATE", "DELETE"]
        resources:   ["deployments", "replicasets", "daemonsets", "statefulsets"]
      - apiGroups:   [""]
        apiVersions: ["v1"]
        operations:  ["CREATE", "UPDATE", "DELETE"]
        resources:   ["pods", "services", "configmaps", "secrets"]
  matchConditions:
    - name: only-service-accounts
      expression: "request.userInfo.username.startsWith('system:serviceaccount:')"
    - name: exclude-platform-principals
      expression: |
        request.userInfo.username != 'system:serviceaccount:argocd:argocd-application-controller' &&
        request.userInfo.username != 'system:serviceaccount:mlops:mlops-pipeline'
  validations:
    - expression: "false"
      message: "Production namespace writes are restricted to ArgoCD (system:serviceaccount:argocd:argocd-application-controller) and the MLOps pipeline (system:serviceaccount:mlops:mlops-pipeline). Other ServiceAccount principals must open a PR to gitops-prod for human review."
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: deny-agent-writes-to-production-binding
spec:
  policyName: deny-agent-writes-to-production
  validationActions: ["Deny", "Audit"]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: production
