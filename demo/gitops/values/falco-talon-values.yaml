# ABOUTME: Helm values for falcosecurity/falco-talon, chart v0.4.0 / app v0.3.0.
# ABOUTME: Wires Talon to act on Falco events forwarded by falcosidekick.
#
# Story this serves on stage: when an agent slips past admission (e.g. by
# kubectl exec'ing into a production pod instead of writing a Deployment),
# Falco fires "Terminal shell in container", falcosidekick forwards to Talon,
# Talon terminates the pod. ArgoCD then self-heals the Deployment.

replicaCount: 1

service:
  type: ClusterIP
  port: 2803

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

# RBAC: the chart's default ClusterRole already includes pod delete/list,
# which is what kubernetes:terminate uses. Leave defaults.
rbac:
  serviceAccount:
    create: true

# Inline rules override. Two-section file: action definitions, then rule
# bindings. Action 'kubernetes:terminate' is the chart's default pod-killer.
# Match clause filters Falco's standard 'Terminal shell in container' rule
# down to the production namespace so we don't kill staging shells.
config:
  rulesOverride: |
    - action: Terminate Pod
      actionner: kubernetes:terminate
      parameters:
        grace_period_seconds: 5
        ignore_standalone_pods: true

    - rule: Kill on shell in production
      match:
        rules:
          - Terminal shell in container
        output_fields:
          - k8s.ns.name=production
      actions:
        - action: Terminate Pod

    - rule: Kill on sensitive file read in production
      match:
        rules:
          - Read sensitive file untrusted
          - Read sensitive file trusted after startup
        output_fields:
          - k8s.ns.name=production
      actions:
        - action: Terminate Pod
