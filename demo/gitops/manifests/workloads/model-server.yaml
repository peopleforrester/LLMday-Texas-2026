---
# Production model-server: plain Deployment (KServe was dropped from
# the GitOps tree because its Helm chart isn't published at a stable
# URL; raw manifests would be required and that's not justified for an
# 8-minute demo). The demo still calls this "the model server"; the
# narrative isn't materially affected — the agent tries to modify a
# Deployment in production, the gates fire.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-server
  namespace: production
  labels:
    app: model-server
    app.kubernetes.io/name: model-server
    app.kubernetes.io/version: v1.2.0
    app.kubernetes.io/part-of: mlops
    app.kubernetes.io/managed-by: mlops-pipeline
spec:
  replicas: 3
  selector:
    matchLabels:
      app: model-server
  template:
    metadata:
      labels:
        app: model-server
        app.kubernetes.io/name: model-server
        app.kubernetes.io/version: v1.2.0
        app.kubernetes.io/part-of: mlops
        app.kubernetes.io/managed-by: mlops-pipeline
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 5
      containers:
        - name: model-server
          image: nginxinc/nginx-unprivileged:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 5
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: nginx-tmp
              mountPath: /tmp
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: nginx-tmp
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: model-server-pdb
  namespace: production
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: model-server
---
# Workflow Template ("right path" verbal reference)
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: promote-model-to-production
  namespace: argo
spec:
  serviceAccountName: argo-workflow
  entrypoint: promote
  arguments:
    parameters:
      - name: model-version
        value: "v1.3.0"
  templates:
    - name: promote
      steps:
        - - name: fetch-from-registry
            template: noop
        - - name: run-eval-suite
            template: noop
        - - name: sign-artifact-cosign
            template: noop
        - - name: open-pr-to-gitops-prod
            template: noop
        - - name: notify-platform-team
            template: noop
    - name: noop
      container:
        image: alpine:3.20
        command: [sh, -c]
        args: ["echo 'right-path placeholder; real workflow lives in your platform-team repo'"]
