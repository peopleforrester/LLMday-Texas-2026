---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: deny-agent-writes-to-production
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps", ""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["deployments", "pods", "services", "configmaps"]
      - apiGroups: ["serving.kserve.io"]
        apiVersions: ["v1beta1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["inferenceservices"]
  matchConditions:
    - name: only-production-namespace
      expression: "request.namespace == 'production'"
    - name: only-agent-sa
      # Target the over-scoped agent SA specifically. The talk's lesson
      # is that THIS principal has too much RBAC and the server-side
      # admission policy is what catches it. Blanket-denying all non-
      # allowlisted SAs also blocked built-in controllers (e.g. the
      # kube-system ReplicaSet controller creating pods on behalf of a
      # legitimately-created Deployment), which broke the model-server
      # workload itself.
      expression: "request.userInfo.username == 'system:serviceaccount:staging:claude-agent'"
  validations:
    - expression: "false"
      message: "ValidatingAdmissionPolicy 'deny-agent-writes-to-production' denied this request. The claude-agent ServiceAccount in the staging namespace is intentionally over-scoped via RBAC; the server-side admission policy is the gate that catches the write. To ship a change to production, open a PR to gitops-prod for human review."
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: deny-agent-writes-to-production-binding
spec:
  policyName: deny-agent-writes-to-production
  validationActions: ["Deny", "Audit"]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: production
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: staging-quota
  namespace: staging
spec:
  hard:
    requests.cpu: "1"
    requests.memory: "1Gi"
    limits.cpu: "2"
    limits.memory: "2Gi"
    count/deployments.apps: "10"
    count/pods: "20"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: production-quota
  namespace: production
spec:
  hard:
    requests.cpu: "2"
    requests.memory: "2Gi"
    limits.cpu: "4"
    limits.memory: "4Gi"
    count/deployments.apps: "20"
    count/pods: "40"
