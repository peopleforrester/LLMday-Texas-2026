# Helm values for the Falco chart (falcosecurity/falco).
# Installed by demo/provision-cluster.sh.
# Modern-eBPF driver works on Bottlerocket nodes (EKS Auto Mode default).

driver:
  enabled: true
  kind: modern-ebpf

tty: true

falco:
  json_output: true
  json_include_output_property: true
  log_level: info
  syscall_event_drops:
    actions:
      - log
      - alert
    rate: 0.03333
    max_burst: 10

# DaemonSet — one Falco pod per node. Bottlerocket nodes in EKS Auto Mode
# can host privileged pods when the Pod Security Standard is satisfied.
falcoctl:
  artifact:
    install:
      enabled: true
    follow:
      enabled: true

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

tolerations:
  - operator: Exists
